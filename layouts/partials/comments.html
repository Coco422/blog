<div id="giscus-container"></div>
<script>
  (function lazyLoadGiscus() {
    const container = document.getElementById("giscus-container");
    if (!container) return;

    const giscusAttributes = {
        "src": "https://giscus.app/client.js",
        "data-repo": "Coco422/discus",
        "data-repo-id": "R_kgDOPczXuQ",
        "data-category": "Announcements",
        "data-category-id": "DIC_kwDOPczXuc4CuF9-",
        "data-mapping": "og:title",
        "data-strict": "0",
        "data-reactions-enabled": "1",
        "data-emit-metadata": "0",
        "data-input-position": "top",
        // Dooki blocks CSS requests whose Origin is giscus.app; jsDelivr serves the same repository file with CORS.
        "data-theme": "https://cdn.jsdelivr.net/gh/Coco422/blog@main/static/giscus-paper.css",
        "data-lang": "zh-CN",
        "data-loading": "lazy",
        "crossorigin": "anonymous",
        "async": "",
    };

    const loadGiscus = () => {
      if (container.dataset.loaded) return;
      container.dataset.loaded = "true";
      const giscusScript = document.createElement("script");
      Object.entries(giscusAttributes).forEach(([key, value]) => giscusScript.setAttribute(key, value));
      container.appendChild(giscusScript);
    };

    const observe = () => {
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          if (!entries.some((entry) => entry.isIntersecting)) return;
          observer.disconnect();
          loadGiscus();
        }, { rootMargin: "800px 0px" });
        observer.observe(container);
      } else {
        loadGiscus();
      }
    };

    if (document.readyState === "complete") {
      observe();
    } else {
      window.addEventListener("load", observe, { once: true });
    }
  })();
</script>
